services:
  - type: web
    name: pousada
    env: python
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: gunicorn pousada.wsgi:application
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pousada_db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.0
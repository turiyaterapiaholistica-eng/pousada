services:
  - type: web
    name: backend
    env: python
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: cd backend && gunicorn backend.wsgi:application
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sistema_gestao
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://*.onrender.com,http://localhost:8000,http://127.0.0.1:8000"

databases:
  - name: sistema_gestao
    databaseName: cozinha_bznb
    user: cozinha_bznb_user
    plan: free
    ipAllowList:
      - source: 0.0.0.0/0
        description: everywhere